# application-test.yaml
spring:
  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  datasource:
    taco:
      jdbc-url: jdbc:h2:mem:tacotestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS tacodb\;SET SCHEMA tacodb
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
    auth:
      jdbc-url: jdbc:h2:mem:tacotestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS auth_db\;SET SCHEMA auth_db
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
