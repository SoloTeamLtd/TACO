<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Вход в Taco Cloud</title>
  <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-card">
  <h2>Вход в кабинет</h2>

  <div class="error-box" th:if="${param.error}">
    Неверный номер телефона или пароль.
  </div>

  <div class="success-box" th:if="${param.success}">
    ✅ Аккаунт успешно создан! Войдите с номером телефона и паролем.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="phone">Номер телефона</label>
      <input type="text" id="phone" name="phone" placeholder="+79991234567" required autofocus />
    </div>

<!--    <div class="form-group">-->
<!--      <label for="password">Пароль</label>-->
<!--      <input type="password" id="password" name="password" placeholder="••••••••" required />-->
<!--    </div>-->

    <div class="form-group" style="position: relative;">
      <label for="password">Пароль:</label>
      <div style="position: relative; display: flex; align-items: center;">
        <input type="password" id="password" name="password" required
               style="width: 100%; padding-right: 40px; box-sizing: border-box;" />

        <!-- Кнопочка-глазок поверх поля ввода -->
        <button type="button" id="togglePassword"
                style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 18px; padding: 0; color: #7f8c8d;">
          👁️
        </button>
      </div>
    </div>

    <!-- Скрипт переключения видимости (вставь в самый конец файла перед тегом </body>) -->
    <script>
      const togglePassword = document.querySelector('#togglePassword');
      const password = document.querySelector('#password');

      togglePassword.addEventListener('click', function (e) {
        // Переключаем тип поля
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);

        // Меняем иконку глазка (открытый/закрытый)
        this.textContent = type === 'password' ? '👁️' : '🙈';
      });
    </script>

    <button type="submit" class="auth-btn btn-blue">Далее</button>
  </form>

  <div class="auth-links">
    Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрироваться</a>
  </div>
</div>

</body>
</html>
