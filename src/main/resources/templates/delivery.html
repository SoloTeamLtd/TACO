<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org"
      xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Kitchen title</title>
</head>
<body>
    <div class="container">
        <h2>Заказы в очереди на доставку</h2>
        <table>
            <thead>
                <tr>
                    <th>ID заказа</th>
                    <th>Составв Тако</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody>
                <!-- Видит только доставка и админ -->
                <a th:href="@{/management/kitchen}" th:authorize="hasAnyAuthority('ROLE_DELIVERY', 'ROLE_ADMIN')">
                    <button>Панель Доставки</button>
                </a>
                <!-- Цикл по заказам со статусом READY -->
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">2</td>
                    <td>
                        <div th:each="taco : ${order.tacos}">
                            <strong th:text="${taco.name}">Супер Тасо</strong>
                        </div>
                    </td>
                    <td>
                        <!-- Форма отправляет POST-запрос на перевод в статус DELIVERING -->
                        <form method="POST" th:action="@{/management/delivery/start/{id}(id=${order.id})}">
                            <button class="btn" type="submit">Взять заказ на доставку</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
<!--    <div class="container">-->
<!--        <h2>Заказы в процессе приготовления</h2>-->

<!--    </div>-->
</body>
</html>
