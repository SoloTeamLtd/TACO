<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org"
      xmlns:background-color="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="UTF-8">
        <title>Delivery Management</title>
        <link th:hre="@{/css/styles.css}" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="header-actions">
                <h2>Заказы в очереди на доставку</h2>
                <!-- Видит только доставка и админ -->
                <a th:href="@{/management/deivery}"
                   sec:authorize="hasAnyAuthority('ROLE_DELIVERY', 'ROLE_ADMIN')" class="btn">
                    Обновить панель доставки
                </a>
            </div>

            <table class="order-table">
                <thead>
                    <tr>
                        <th>ID заказа</th>
                        <th>Составв Тако</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Цикл по заказам со статусом READY -->
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}">2</td>
                        <td>
                            <div th:each="taco : ${order.tacos}">
                                <strong th:text="${taco.name}">Супер Тасо</strong>
                            </div>
                        </td>
                        <td>
                            <!-- Форма отправляет POST-запрос на перевод в статус DELIVERING -->
                            <form method="POST"
                                  th:action="@{/management/delivery/start/{id}(id=${order.id})}">
                                <button class="btn btn-action" type="submit">Взять заказ на доставку</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
