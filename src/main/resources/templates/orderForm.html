<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Taco Cloud Order</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<header>
    <h1>Order your taco creations!</h1>
</header>
    <div class="container">
        <form method="POST" th:action="@{/orders}" th:object="${tacoOrder}">
            <h2>Deliver my master tacos to...</h2>

            <!-- Поле ввода имени получателя -->
            <div class="form-group">
                <label for="deliveryName">Name:</label>
                <input type="text" th:field="*{deliveryName}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('deliveryName')}"
                      th:errors="*{deliveryName}">Error</span>
            </div>

            <!-- Поле ввода улицы -->
            <div class="form-group">
                <label for="deliveryStreet">Street address:</label>
                <input type="text" th:field="*{deliveryStreet}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('deliveryStreet')}"
                      th:errors="*{deliveryStreet}">Error</span>
            </div>

            <!-- Поле ввода имени города -->
            <div class="form-group">
                <label for="deliveryCity">City:</label>
                <input type="text" th:field="*{deliveryCity}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('deliveryCity')}"
                      th:errors="*{deliveryCity}">Error</span>
            </div>

            <!-- Поле ввода имени штата/региона -->
            <div class="form-group">
                <label for="deliveryState">State:</label>
                <input type="text" th:field="*{deliveryState}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('deliveryState')}"
                      th:errors="*{deliveryState}">Error</span>
            </div>

            <!-- Поле ввода индекса -->
            <div class="form-group">
                <label for="deliveryZip">Zip code:</label>
                <input type="text" th:field="*{deliveryZip}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('deliveryZip')}"
                      th:errors="*{deliveryZip}">Error</span>
            </div>

            <h2>Payment details...</h2>

            <!-- Номер карты -->
            <div class="form-group">
                <label for="ccNumber">Credit Card Number:</label>
                <input type="text" th:field="*{ccNumber}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('ccNumber')}"
                      th:errors="*{ccNumber}">Error</span>
            </div>

            <!-- Срок действия -->
            <div class="form-group">
                <label for="ccExpiration">Expiration (MM/YY):</label>
                <input type="text" th:field="*{ccExpiration}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('ccExpiration')}"
                      th:errors="*{ccExpiration}">Error</span>
            </div>

            <!-- Код CVV -->
            <div class="form-group">
                <label for="ccCvv">CVV:</label>
                <input type="text" th:field="*{ccCvv}"/>
                <span class="validation-error" th:if="${#fields.hasErrors('ccCvv')}"
                      th:errors="*{ccCvv}">Error</span>
            </div>

            <button class="btn" type="submit">Submit Order</button>
        </form>
    </div>
</body>
</html>
