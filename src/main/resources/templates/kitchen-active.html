<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Активные заказы — Кухня</title>
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="header-actions">
    <h2>🔥 Заказы в процессе приготовления</h2>
    <div>
      <a th:href="@{/management/kitchen/queue}" class="btn btn-secondary">В очередь новых</a>
      <a th:href="@{/home}" class="btn btn-secondary">На главную</a>
    </div>
  </div>

  <table class="order-table">
    <thead>
    <tr>
      <th>ID заказа</th>
      <th>Что готовим (Рецепт и Ингредиенты)</th>
      <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
      <td th:text="${order.id}">123</td>
      <td>
        <!-- Перебираем все тако в заказе -->
        <div th:each="taco : ${order.tacos}" class="taco-dish-block" style="margin-bottom: 15px;">
          <h4 th:text="${taco.name}" style="margin: 0 0 5px 0; color: var(--primary-color);">Название Тако</h4>
          <!-- Перебираем ингредиенты конкретного тако -->
          <ul style="margin: 0; padding-left: 20px;">
            <li th:each="ingredient : ${taco.ingredients}" th:text="${ingredient.name}">Ингредиент</li>
          </ul>
        </div>
      </td>
      <td>
        <!-- Форма переводит заказ в статус READY (Готов к доставке) -->
        <form method="POST" th:action="@{/management/kitchen/finish/{id}(id=${order.id})}">
          <button class="btn" style="background-color: #2ecc71;" type="submit">Приготовлено ✓</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(orders)}">
      <td colspan="3" style="text-align: center; color: var(--secondary-color);">Сейчас ничего не готовится. Отдыхаем!</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
