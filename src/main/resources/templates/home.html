<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Taco Cloud</title>
    <!-- Подключаем твой файл стилей -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<!-- Навигационная панель / Шапка -->
<header class="main-header">
    <h1 class="logo-title">Welcome to Taco Cloud!</h1>
    <div class="auth-zone">
        <!-- Если пользователь НЕ авторизован совсем ИЛИ находится в процессе 2FA (ROLE_PRE_AUTH) -->
        <div sec:authorize="isAnonymous() or hasAuthority('ROLE_PRE_AUTH')">
            <a th:href="@{/auth/login}" class="btn btn-secondary">Login by Phone</a>
        </div>

        <!-- Если пользователь полностью авторизован (прошел оба этапа 2FA) -->
        <!-- Избегаем показа имени пользователя во время ROLE_PRE_AUTH -->
        <div sec:authorize="isAuthenticated() and !hasAuthority('ROLE_PRE_AUTH')" class="user-profile">
                <span class="welcome-text">
                    Hello, <strong sec:authentication="principal.username">User</strong>!
                </span>
            <!-- Кнопка Logout оформлена как POST-форма для защиты от CSRF -->
            <form th:action="@{/logout}" method="POST" class="logout-form">
                <button type="submit" class="btn-link">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Основной контент страницы -->
<div class="container text-center">
    <h2>The best tacos in the cloud matrix</h2>

    <div class="logo-wrapper">
        <img th:src="@{/images/TacoCloud.png}" alt="Taco Cloud Logo" class="main-logo">
    </div>

    <!-- Панель навигации по внутренним кухням (динамическая под роли) -->
    <div class="action-grid">

        <!-- Ссылка на сборку тако: Видит только полноценный USER или ADMIN -->
        <div sec:authorize="hasAnyAuthority('ROLE_USER', 'ROLE_ADMIN')">
            <a th:href="@{/design}" class="btn btn-primary">Design your taco</a>
        </div>

        <!-- Панель Кухни: Видит только повар KITCHEN или ADMIN -->
        <div sec:authorize="hasAnyAuthority('ROLE_KITCHEN', 'ROLE_ADMIN')">
            <a th:href="@{/management/kitchen}" class="btn btn-warning">Панель Кухни</a>
        </div>

        <!-- Панель Доставки: Видит только курьер DELIVERY или ADMIN -->
        <div sec:authorize="hasAnyAuthority('ROLE_DELIVERY', 'ROLE_ADMIN')">
            <a th:href="@{/management/delivery}" class="btn btn-info">Панель Доставки</a>
        </div>

    </div>
</div>

</body>
</html>
