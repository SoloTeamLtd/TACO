<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org"
      xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Taco Cloud</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px;">
        <h1 style="margin: 0;">Welcome to Taco Cloud!</h1>
        <div>
            <!-- Если пользователь НЕ авторизован -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/auth/phone}" class="btn" style="text-decoration: none; background-color: #7f8c8d;">Login by Phone</a>
            </div>
            <!-- Если пользователь авторизован -->
            <div sec:authorize="isAuthenticated()" style="color: white;">
                <span style="margin-right: 15px;">Hello, <strong sec:authentication="name">User</strong>!</span>
                <form th:action="@{/logout}" method="POST" style="display: inline;">
                    <button type="submit" class="btn" style="background: none; border: none; padding: 0; color: #dbf0f9;
                     cursor: pointer; text-decoration: underline; font-size: 14px;">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <div class="container" style="text-align: center;">
        <h2>The best tacos in the cloud matrix</h2>
        <div style="margin: 20px 0;">
            <img th:src="@{/images/TacoCloud.png}" alt="Taco Cloud Logo" style="max-width: 200px; border-radius: 8px;">
        </div>
        <br>
        <a th:href="@{/design}" class="btn" style="text-decoration: none; font-size: 18px; padding: 15px 30px;">Design your taco</a>
    </div>
</body>
</html>
