<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Design Your Taco</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Design your master taco!</h1>
    </header>
    <div class="container">
        <form method="POST" th:action="@{/design}" th:object="@{taco}">
            <div th:if="${#fields.hasErrors()}" class="validation-error" style="font-size: 18px; margin-bottom: 20px">
                Please correct the errors below.
            </div>

            <div class="grid">
                <!-- Секция WRAP (Лепешки) -->
                <div class="grid-box">
                    <h3>Designate your wrap:</h3>
                    <div th:each="ingredient : ${wrap}" class="ingredient-row">
                        <input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
                        <span th:text="${ingredient.name}">Ingredient</span>
                    </div>
                </div>

                <!-- Секция PROTEIN (Мясо/Начинка) -->
                <div class="grid-box">
                    <h3>Pick your protein:</h3>
                    <div th:each="ingredient : ${protein}" class="ingredient-row">
                        <input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
                        <span th:text="${ingredient.name}">Ingredient</span>
                    </div>
                </div>

                <!-- Секция VEGGIES (Овощи) -->
                <div class="grid-box">
                    <h3>Pick your veggies:</h3>
                    <div th:each="ingredient : ${veggies}" class="ingredient-row">
                        <input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
                        <span th:text="${ingredient.name}">Ingredient</span>
                    </div>
                </div>

                <!-- Секция CHEESE (Сыр) -->
                <div class="grid-box">
                    <h3>Pick your cheese:</h3>
                    <div th:each="ingredient : ${cheese}" class="ingredient-row">
                        <input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
                        <span th:text="${ingredient.name}">Ingredient</span>
                    </div>
                </div>
            </div>

            <!-- Ввод названия для придуманного тако -->


        </form>
    </div>
</body>
</html>
