spring:
  application:
    name: taco-app
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false

app:
  datasource:
    taco:
      url: jdbc:postgresql://localhost:5432/tacodb
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      changelog: classpath:db/changelog/db.changelog-taco.yaml
    auth:
      url: jdbc:postgresql://localhost:5432/auth_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      changelog: classpath:db/changelog/db.changelog-auth.yaml

jwt:
  secret: ${JWT_SECRET:local_development_secret_key_minimum_256_bits_length_taco_delivery}
