databaseChangeLog:
  - changeSet:
      id: 1-create-ingredient-type-table
      author: IvanA
      preConditions:
        - onFail: MARK_RAN # Если таблица есть, Liquibase просто пометит шаг как выполненный
          not:
            tableExists:
              tableName: ingredient_type
      changes:
        - createTable:
            tableName: ingredient_type
            columns:
              - column:
                  name: id
                  type: VARCHAR(10)
                  constraints:
                    primaryKey: true
                    nullable: false

  - changeSet:
      id: 2-create-ingredient-table
      author: IvanA
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: ingredient
      changes:
        - createTable:
            tableName: ingredient
            columns:
              - column:
                  name: id
                  type: VARCHAR(4)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: type_id
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    # Внешний ключ выносим в отдельный changeset или добавляем условие,
                    # чтобы он не пытался создаться дважды, если таблица уже была.
  - changeSet:
      id: 2b-add-fk-ingredient
      author: IvanA
      preConditions:
        - onFail: MARK_RAN
          not:
            foreignKeyConstraintExists:
              foreignKeyTableName: ingredient
              foreignKeyConstraintName: fk_ingredient_type

      changes:
        - addForeignKeyConstraint:
            baseTableName: ingredient
            baseColumnNames: type_id
            constraintName: fk_ingredient_type
            referencedTableName: ingredient_type
            referencedColumnNames: id