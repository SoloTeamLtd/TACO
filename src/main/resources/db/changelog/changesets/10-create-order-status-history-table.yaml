databaseChangeLog:
  - changeSet:
      id: 10-create-order-status-history-table
      author: IvanA
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: order_status_history
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false }, autoIncrement: true }
              - column: { name: taco_order_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: from_status, type: VARCHAR(30) } # Может быть null для самого первого статуса
              - column: { name: to_status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: changed_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: changed_by, type: VARCHAR(100) }
        - addForeignKeyConstraint:
            baseTableName: order_status_history
            baseColumnNames: taco_order_id
            constraintName: fk_status_history_taco_orders
            referencedTableName: taco_orders
            referencedColumnNames: id
            onDelete: CASCADE
