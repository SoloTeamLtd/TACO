databaseChangeLog:
  - changeSet:
      id: 14-load-initial-users
      author: IvanA
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
        - tableIsEmpty:
            tableName: users
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              
              INSERT INTO users (id, name, phone, password, role) VALUES 
              (1, 'Admin', '+79991112233', crypt('password', gen_salt('bf', 10)), 'ROLE_ADMIN'),
              (2, 'User', '+79994445566', crypt('password', gen_salt('bf', 10)), 'ROLE_USER'),
              (3, 'Chef', '+79997778899', crypt('password', gen_salt('bf', 10)), 'ROLE_KITCHEN'),
              (4, 'Courier', '+79990001122', crypt('password', gen_salt('bf', 10)), 'ROLE_DELIVERY');
